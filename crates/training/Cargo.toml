[package]
name = "sparam-training"
edition.workspace = true
version.workspace = true

[dependencies]
# `varmap` enables sparam-core's `determinism` module (the helpers
# this crate's trainer needs).  See `crates/core/Cargo.toml`.
sparam-core = { workspace = true, features = ["varmap"] }
sparam-physics = { workspace = true }
sparam-models = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
serde_json = { workspace = true }
sparam-core = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
